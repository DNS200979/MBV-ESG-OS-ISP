# Testes que rodam sem projeto Supabase: parsers de XML e sintaxe dos módulos.
# O teste de RLS (supabase/tests/01_rls.sql) roda contra um Postgres efêmero.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Sintaxe dos módulos ES
        run: |
          mkdir -p .chk
          for f in assets/js/*.js; do cp "$f" ".chk/$(basename "$f" .js).mjs"; done
          for f in .chk/*.mjs; do node --check "$f"; done
      - name: Parsers NF-e / CT-e
        run: |
          npm i --no-save @xmldom/xmldom
          node tests/xml.test.mjs
      - name: Importador CSV / XLSX / XML
        run: node tests/importador.test.mjs

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações, seeds e testar RLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/00_stub_supabase.sql
          for f in supabase/migrations/*.sql; do
            case "$f" in *storage*) continue;; esac   # storage.* não existe fora do Supabase
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in supabase/seed/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/01_rls.sql
